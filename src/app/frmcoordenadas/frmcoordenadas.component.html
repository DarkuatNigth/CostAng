<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>

<div style="padding:1%">
    <div class="card col-lg-4 col-md-6 col-sm-10 col-xs-12" style="margin-left: auto; margin-right: auto;" >
        <div class="card-header" style="font-weight: bold;">
            Ingrese sus Coordenadas
        </div>
        <div class="card-body">
    
            <div class="row" style="padding-left: 2%; padding-right: 2%;">
                <div align="center" style="height: auto;width: 100%;z-index:1">
                    <img src="assets/images/coordenadas.png" style="height: auto;width: 100px; z-index:1;position: relative"
                        alt="logo" />
                </div>
            </div>
            <div class="row" style="padding-left: 2%; padding-right: 2%;">
                <div class="col-lg-12 col-md-12 col-sm-12 col-xl-12">
                    <div class="form-group row">
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xl-4">
                            <div class="form-group row">
                                <label class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1 text-center control-label" style="font-weight:bold;">{{lbl1}}</label>
                                <div class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1">
                                    <input type="password" (keypress)="isNumberKey($event)"
                                    [(ngModel)]="txt_lbl1" class="form-control">
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xl-4">
                            <div class="form-group row">
                                <label class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1 text-center control-label" style="font-weight:bold;">{{lbl2}}</label>
                                <div class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1">
                                    <input type="password" (keypress)="isNumberKey($event)" [(ngModel)]="txt_lbl2" class="form-control">
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-4 col-sm-4 col-xl-4">
                            <div class="form-group row">
                                <label class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1 text-center control-label" style="font-weight:bold;">{{lbl3}}</label>
                                <div class="col-xl-12 col-sm-12 col-md-12 col-lg-12 pb-1">
                                    <input type="password" (keypress)="isNumberKey($event)" [(ngModel)]="txt_lbl3" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12 col-md-12 col-sm-12 col-xl-12">
                    <a class="btn btn-block btn-lg btn-info" style="color: white;"
                        
                        (click)="checkCoodernadas()">Ingresar</a>
                </div>
            </div>
        </div>
    </div>
</div>
