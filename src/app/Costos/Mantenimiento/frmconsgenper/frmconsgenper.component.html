<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>
<dx-context-menu
  #contextMenu
  [dataSource]=""
  [width]="200"
  target="#idDetalle"
>
</dx-context-menu>

<div class="row" style="padding-left: 1%; padding-right: 1%; padding-top: 1%">
  <div class="col-lg-2 col-md-3 col-sm-6 col-xs-6 col-6 pb-1">
    <button
      type="button"
      style="width: 100%"
      class="btn btn-outline-secondary"
      (click)="onClickNuevo()"
    >
      <i class="fa fa-file" style="padding-right: 15px"></i>Nuevo
    </button>
  </div>
  <div class="col-lg-2 col-md-3 col-sm-6 col-xs-6 col-6 pb-1">
    <dx-button
      icon="find"
      type="default"
      text="Consultar"
      (onClick)="onClickConsultar(modalConsultaGeneralPermiso)"
      style="width: 100%"
    >
    </dx-button>
  </div>
  <div class="col-lg-2 col-md-3 col-sm-6 col-xs-6 col-6 pb-1">
     <dx-button
      icon="save"
      type="success"
      text="Guardar"
      (onClick)="onClickGuardarPermisos()"
      style="width: 100%"
    >
    </dx-button>
  </div>
 
</div>
<div style="padding-left: 1%; padding-right: 2%; padding-top: 1%">
  <div class="card">
    <div
      class="card-header"
      style="font-weight: bold;
        border: 2px solid #d9dbdd;
        border-radius: 4px;
        color: #0087b9;">Asignar Consultas por Usuario
    </div>
    <div
      class="card-body"
      style="border: 2px solid #d9dbdd; border-radius: 4px">
      <div class="form-group">
        <div class="row">
          
          <label
            for="inputEmail3"
            class="col-xs-12 col-sm-12 col-md-6 col-lg-1 pb-1 text-left control-label"
            style="font-size: 12px">Usuario:</label>
            <div class="col-xs-12 col-sm-12 col-md-4 col-lg-2 pb-1"
            style="display: flex">
            <input
              type="text"
              class="form-control uppercase-input"
              [(ngModel)]="txtCodigo"
              (keydown)="onKeyPressUsuario($event)"/>
            <dx-button
              icon="more"
              style="width: 35px; height: 30px"
              (click)="onClickUsuario(modalConsultaGeneralUsuario)">
            </dx-button>
          </div>
          <div class="col-xs-12 col-sm-12 col-md-6 col-lg-8 pb-1">
            <input
              type="text"
              class="form-control"
              readonly="true"
              style="font-size: 13px"
              [(ngModel)]="txtnombre"
            />
          </div>
    
          <label
            for="inputEmail3"
            class="col-xs-12 col-sm-12 col-md-6 col-lg-1 pb-1 text-left control-label"
            style="font-size: 12px">{{lblnombre}}</label>

        
          <div class="w-100 d-lg-block d-md-none"></div>
          <div class="w-100 d-lg-none"></div>

          
          <div class="w-100 d-lg-block d-md-none"></div>
          <div class="w-100 d-lg-none"></div>
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 pb-1">
            <fieldset
            class="border p-2"
            style="
              padding-bottom: 1px;
              border: 1px solid #d6d8db !important;">
            <legend
              class="float-none w-auto p-2"
              style="color: #0087b9">
              Permisos
            </legend>
            
            <dx-data-grid
            #GridPeriodoDetalle
            [dataSource]="DataPermisoUsuario"
            style="width: 100%; max-height: 40vh"
            [dataSource]=""
            class="cssDetalleGrid"
            [showColumnLines]="true"
            [showRowLines]="true"
            [showBorders]="true"
            [rowAlternationEnabled]="true"
            [columnHidingEnabled]="false"
            [columnAutoWidth]="true">
            <dxo-sorting mode="none"></dxo-sorting>
            
            <dxi-column
              dataField="codigoper"
              [visible]="false"
              [caption]="'Codigo'">
            </dxi-column>
            <dxi-column
              dataField="usuario"
              [visible]="false"
              [caption]="'Usuario'">
            </dxi-column>
            <dxi-column
              dataField="codconsulta"
              [caption]="'codconsulta'"
              [visible]="false"
              [allowEditing]="false">
            </dxi-column>
            <dxi-column
              dataField="consulta"
              [caption]="'Consulta'"
              [visible]="true"
              [allowEditing]="false">
            </dxi-column>
          
            <dxi-column
              dataField="estado"
              cellTemplate="cellTempCheckEstado"
              [caption]="'Asignar'"
              [dataType]="'boolean'"
              [visible]="true"
              [allowEditing]="false">
            </dxi-column>
          
            <div *dxTemplate=" let cell of 'cellTempCheckAsignar'">
              <div>
                <input  type="checkbox"
                  class="cssCheckBox"
                  (change)="
                    onChangeCridEditar(
                      cell.value,
                      cell,
                      false)"
                  [(ngModel)]="cell.value"
                  style="
                    width: 100%;
                    border: 0px;
                    background-color: transparent;
                    text-align: right;"/>
              </div>
            </div>

            <div *dxTemplate=" let cell of 'cellTempCheckEstado'">
              <div>
                <input  type="checkbox"
                  class="cssCheckBox"
                  (change)="
                    onChangeCridEditarEstado(
                      cell.value,
                      cell,
                      false)"
                  [(ngModel)]="cell.value"
                  style="
                    width: 100%;
                    border: 0px;
                    background-color: transparent;
                    text-align: right;"/>
              </div>
            </div>
            
            </dx-data-grid>
        </fieldset>
          </div> 
          
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #modalConsultaGeneralPermiso let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Consulta Generales Permisos por Usuario</h4>
    <button
      type="button"
      class="close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')">
      <span aria-hidden="true"> × </span>
    </button>
  </div>
  <div
    class="modal-body mostly-customized-scrollbar"
    style="max-height: 70vh; overflow: auto">
    <div class="col-lg-12">
      <div class="row" style="padding-left: 2%; padding-right: 2%">
       
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 pb-1">
          <dx-data-grid
            style="width: 100%; max-height: 60vh"
            [dataSource]="listaConsultaGeneralPermiso"
            [columns]="columnasTitulos"
            [showColumnLines]="true"
            [showRowLines]="true"
            [showBorders]="true"
            [rowAlternationEnabled]="true"
            [columnHidingEnabled]="false"
            [columnAutoWidth]="true"
            (onRowDblClick)="onRowConsGeneralDoubleClick($event, modal)">
            <dxo-selection mode="single"></dxo-selection>
            <dxo-search-panel
              [visible]="true"
              width="100%"
              placeholder="Buscar...">
            </dxo-search-panel>
            <dxo-paging [pageSize]="10" [pageIndex]="0"> </dxo-paging>
          </dx-data-grid>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="modal.close()">
      Cancelar
    </button>
  </div>
</ng-template>
