<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>

<div style="padding: 10px 2%">
    <div class="row">

        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn">
            <dx-button text="" icon="panelright" hint="Mostrar Panel 'Consultas Disponibles'" type="outlined" (onClick)="toggleList()">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn" [hidden]="!ShowConsulta">
            <dx-button text="Consultar" icon="find" type="default" (onClick)="onClickConsultar('Consultar')">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-4 col-sm-6 col-xs-12 col-12 pb-1 sng-dbtn" [hidden]="!ShowImprimir">
            <dx-button
              text="Imprimir"
              style="width: 100%"
              icon="print"
              (onClick)="onClickConsultar('Imprimir')"
            ></dx-button>
          </div>

        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn" [hidden]="hiddenExporting">
            <button type="button" style="width: 100%;" class="btn btn-outline-secondary"
                    (click)="onclickExportarExcel()">
                    <i class="fa fa-file-excel" style="padding-right: 15px;"></i>Exportar Excel</button>
        </div>
        

        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn" [hidden]="!ShowOtraAccionDescarga">
            <dx-button  icon="download" type="success"
                [text]="this.selectedItemConsulta?.otraAccionDescarga" (onClick)="onclickExportarOtraAccion()"
                style="width: 100%">
            </dx-button>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-sm-12 col-md-4 col-lg-4 pb-1">
            <dx-list #ListReportes
                *ngIf="isListVisible"
                id = "ListReportes"
                [dataSource]="reportes" 
                [height]="400"
                displayExpr="descriConsulta"
                selectionMode="single"
                [searchEnabled]="true"
                searchExpr="descriConsulta"
                searchMode="contains"
                (onItemClick)="onItemClickConsulta($event)"
                style="font-size: 14px;"
            >
            </dx-list>
        </div>
        <div id="sec_resultado" class="col-12 col-sm-12 col-md-8 col-lg-8 pb-1">
            <p class="sng-grid-title">{{ title }}</p>

            <div class="form-group row" (click)="hideList()" >
                <ng-container *ngFor="let i of filtrosFiltrados('')" style="padding: 0;">
                    <label *ngIf="i.tipo !== 'textGroup'" class="col-xs-12 col-sm-12 col-md-2 col-lg-1 col-6 text-left control-label" style="margin-bottom: 0;">{{ i?.label }}</label>
                    <div *ngIf="i.tipo !== 'textGroup'" class="col-xs-12 col-sm-12 col-md-4 col-lg-3 col-6 pb-1">
                        <ng-container *ngTemplateOutlet="controlTemplate; context: { param: i }"></ng-container>
                    </div>
                    <div *ngIf="i.SaltoLinea" class="w-100 d-lg-none d-md-block"></div>
                    <div *ngIf="i.SaltoLinea" class="w-100 d-lg-block"></div>
                </ng-container>
                <ng-container *ngFor="let i of filtrosFiltrados('textGroup')" style="padding: 0;">
                    <div class="w-100 d-lg-none d-md-block"></div>
                    <div class="w-100 d-lg-block"></div>

                    <label class="col-xs-12 col-sm-12 col-md-2 col-lg-1 col-6 text-left control-label" style="margin-bottom: 0;">{{ i?.label }}</label>
                    <div class="col-xs-12 col-sm-12 col-md-10 col-lg-8 pb-1" style="display: flex">
                        <ng-container *ngTemplateOutlet="controlTemplate; context: { param: i }"></ng-container>
                    </div>
                    <div *ngIf="i.SaltoLinea" class="w-100 d-lg-none d-md-block"></div>
                    <div *ngIf="i.SaltoLinea" class="w-100 d-lg-block"></div>
                </ng-container>
                
              
            </div>
            
            <div class="form-group row" (click)="hideList()" >
                <dx-data-grid [hidden]="!visibleGrid" style="width: 100%;max-height: 60vh;"
    #Griddata
    class="cssGridSearch"
    [dataSource]="resultados"
    [columns]="resultadosColumnsNames"
    keyExpr="{{resultadosColumnsNames[0]?.dataField}}"
    [showColumnLines]="true"
    [showRowLines]="true"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    [columnHidingEnabled]="false"
    [columnAutoWidth]="true"
    (onCellDblClick)="onCellDblClick($event)">
    
    <dxo-selection mode="single"></dxo-selection>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <!-- <dxo-search-panel [visible]="true" width="100%" placeholder="Buscar...">
    </dxo-search-panel> -->
 
    <dxo-paging [enabled]="true" 
        [pageSize]="20"
        [pageIndex]="0">
    </dxo-paging>

</dx-data-grid>
                <div [hidden]="!visibleGrid" style="text-align: left;color: #777474;font-family: 'Arial';
                            font-size: 14px;width: 100%;">
                    <span>Total de Registros: {{ resultados.length }}</span>
                </div>

                <div class="col-1" style="height: 0; max-height: 0px; width: 0px; overflow: hidden;">
                    <dx-pivot-grid style="width: 0px;"
                        [dataSource]="pivotDataSource"
                        [showBorders]="true"
                        [allowSorting]="false"
                        [allowSortingBySummary]="false"
                        [allowFiltering]="false"
                        [showColumnGrandTotals]="false"
                        [showRowGrandTotals]="true"
                        [showRowTotals]="true"
                        [showColumnTotals]="false"
                        height="500">
                        <dxo-field-panel [visible]="true" [allowFieldDragging]="true"></dxo-field-panel>
                    </dx-pivot-grid>
                </div>


            </div>
        </div>
        <div class="form-group">
            <div class="row margin-container">
            </div>
        </div>
    </div>

</div>

<ng-template #controlTemplate let-param="param">
    <!-- ng-select para listas dinámicas -->
    <ng-select *ngIf="param.tipo === 'lista'" style="width: 100%;" [(ngModel)]="parametrosValores[param.name]" 
            appendTo="body" [searchable]="true" [clearable]="true">
        <ng-option *ngFor="let data of gridDataSource[param.name]" [value]="data.Codigo">
            <div title="{{data.Descripcion}}" style="font-size: 12px;"> 
                {{data.Descripcion}}
            </div>
        </ng-option>
    </ng-select>

    

    <!-- CheckBox -->
    <input *ngIf="param.tipo === 'checkbox'" type="checkbox" class="cssCheckBox" [(ngModel)]="parametrosValores[param.name]" name="{{param.name}}" />

    

    <!-- Date Picker -->
    <dx-date-box *ngIf="param.tipo === 'fecha'" [(ngModel)]="parametrosValores[param.name]" type="date" displayFormat="yyyy/MM/dd" 
            adaptivityEnabled="true" openOnFieldClick="true">
    </dx-date-box>

    <!-- Input de texto -->
    <input *ngIf="param.tipo === 'texto'" type="text" class="form-control" [(ngModel)]="parametrosValores[param.name]" >

    <!-- Input de time -->
    <input *ngIf="param.tipo === 'time'" type="time" class="form-control" [(ngModel)]="parametrosValores[param.name]" >


    <!-- dx-drop-down-box -->
    <dx-drop-down-box 
        *ngIf="param.tipo === 'dropdown'"
        [(value)]="parametrosValoresSelect[param.name]"
        [inputAttr]="{ 'aria-label': 'Owner' }"
        valueExpr="Codigo"
        displayExpr="Descripcion"
        [deferRendering]="false"
        [showClearButton]="true"
        [dataSource]="gridDataSource[param.name]"
        [width]="'100%'"
        [dropDownOptions]="{ 
            width: 'auto',
            autoResizeEnabled: true 
          }"
        >
        <div *dxTemplate="let data of 'content'" class="dx-dropdown-content">
            <dx-data-grid
                class="cssGrid" 
                keyExpr="Codigo"
                [dataSource]="gridDataSource[param.name]"
                [columns]="gridColumn[param.name]"
                [selection]="{ mode: 'multiple' }"
                [hoverStateEnabled]="true"
                [paging]="{ enabled: true, pageSize: 10 }"
                [filterRow]="{ visible: false }"
                [scrolling]="{ mode: 'virtual' }"
                [height]="345"
                [(selectedRowKeys)]="parametrosValoresSelect[param.name]"
                [columnAutoWidth]="true"
            >
            <dxo-search-panel [visible]="true" width="100%" placeholder="Buscar..."></dxo-search-panel>
            </dx-data-grid>
        </div>
    </dx-drop-down-box>

    <!-- textGroup -->
    <input *ngIf="param.tipo === 'textGroup'" type="text" class="form-control" [(ngModel)]="parametrosValores[param.name]"
        (keydown)="onKeyPressGroup($event, param.name)" style="width: 20%;"/>
    
    <dx-button *ngIf="param.tipo === 'textGroup'" icon="more" style="width: 35px; height: 30px" 
        (click)="onClickModal(modal, param.name)"></dx-button>

    <input *ngIf="param.tipo === 'textGroup'" type="text" class="form-control" readonly="true" style="font-size: 14px"
        [(ngModel)]="parametrosValores[param.name + '_descri']"/>

</ng-template>


<ng-template #modal let-modal>
    <div class="modal-header">
      <h4 class="modal-title" id="modal-basic-title">Consulta</h4>
      <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
        <span aria-hidden="true"> × </span>
      </button>
    </div>
    <div class="modal-body mostly-customized-scrollbar" style="max-height: 70vh; overflow: auto">
      <div class="col-lg-12">
        <div class="row" style="padding-left: 2%; padding-right: 2%">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 pb-1">
            <dx-data-grid
              style="width: 100%; max-height: 60vh"
              [dataSource]="listaDataModal"
              [columns]="columnasDataModal"
              [showColumnLines]="true"
              [showRowLines]="true"
              [showBorders]="true"
              [rowAlternationEnabled]="true"
              [columnHidingEnabled]="false"
              [columnAutoWidth]="true"
              (onRowDblClick)="onRowDoubleClick($event, modal)">
              <dxo-selection mode="single"></dxo-selection>
              <dxo-search-panel
                [visible]="true"
                width="100%"
                placeholder="Buscar...">
              </dxo-search-panel>
              <dxo-paging [pageSize]="10" [pageIndex]="0"> </dxo-paging>
            </dx-data-grid>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-dark" (click)="modal.close()">
        Cancelar
      </button>
    </div>
  </ng-template>
