<dx-load-panel #loadPanel shadingColor="rgba(0,0,0,0.4)" [(visible)]="loadingVisible" [showIndicator]="true"
    [showPane]="true" [shading]="true" [closeOnOutsideClick]="false">
</dx-load-panel>

<div class="container-fluid mt-3">
    <div class="panel panel-custom">

        <div class="panel-heading">
            <h3 class="panel-title">Distribución de Costos</h3>
        </div>

        <div class="panel-body">
            <div class="row align-items-end">

                <div class="col-md-2 mb-2">
                    <label class="control-label-aspx">Año:</label>
                    <div class="select-wrapper-compact">
                        <ng-select bindLabel="DESCRIPCION" [(ngModel)]="cmbAnio" [searchable]="true"
                            [clearable]="false">
                            <ng-option *ngFor="let data of listAnios" [value]="data.CODIGO">
                                <div class="option-text" title="{{ data.DESCRIPCION }}">
                                    {{ data.DESCRIPCION }}
                                </div>
                            </ng-option>
                        </ng-select>
                    </div>
                </div>

                <div class="col-md-3 mb-2">
                    <label class="control-label-aspx">Mes:</label>
                    <div class="select-wrapper-compact">
                        <ng-select bindLabel="Mes" [(ngModel)]="cmbMes" [searchable]="true" [clearable]="false">
                            <ng-option *ngFor="let data of listMeses" [value]="data.CODIGO">
                                <div title="{{ data.DESCRIPCION }}" style="font-size: 14px">
                                    {{ data.DESCRIPCION }}
                                </div>
                            </ng-option>
                        </ng-select>
                    </div>
                </div>

                <div class="col-md-4 mb-2">
                    <div class="btn-group-aspx">
                        <dx-button text="Consultar" type="default" icon="search"
                            (onClick)="onClickConsultar('Consultar')">
                        </dx-button>

                        <dx-button class="ml-2" icon="save" type="success" (onClick)="onGrabarCostosClick()"
                            text="Guardar">
                        </dx-button>
                    </div>
                </div>

            </div>
            <div class="row" style="padding: 5px; margin-right: 2px">
                    <div class="row" style="padding: 5px; margin-right: 2px">
                        
                        <app-tab-grid 
                        style="width: 100%"
                        [dataSource]="(listadoTotal$ | async)!" 
                        (onDataChanged)="handleDataChange($event)">
                        </app-tab-grid>

                    </div>
            </div>
        </div>
    </div>
</div>
