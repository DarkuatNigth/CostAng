


<div style="padding: 10px 2%">

    <div class="row">
        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn">
        <dx-button text="Consultar" icon="find" type="default" (onClick)="onClickConsultar()">
        </dx-button>
        </div>
    </div>

    <!-- add constrol or controls to select 2 dates, fecha desde and fecha hasta --> 
    <div class="row">
        <div class="date-selection">
            <label class="col-12 control-label">Fecha Desde:</label>
            <div class="col-12 pb-1" style="display: flex">
                <dx-date-box [(ngModel)]="fechaDesde" type="date" displayFormat="yyyy/MM/dd"
                    adaptivityEnabled="true" openOnFieldClick="true" [width]="'100%'" name="fechaDesde"
                    (onValueChanged)="onChangeFechaDesde($event)">
                </dx-date-box>
            </div>

            <label class="col-12 control-label">Fecha Hasta:</label>
            <div class="col-12 pb-1" style="display: flex">
                <dx-date-box [(ngModel)]="fechaHasta" type="date" displayFormat="yyyy/MM/dd"
                    adaptivityEnabled="true" openOnFieldClick="true" [width]="'100%'" name="fechaHasta"
                    (onValueChanged)="onChangeFechaHasta($event)">
                </dx-date-box>
            </div>
        </div>
    </div>   


    <!-- add a grid control with columns lote, fecha, proveedor, piscina. the data will load from data in database -->
    <div class="grid-container">
        <dx-data-grid #gridLotes
            id="gridLotes"
            style="width: 100%; max-height: 60vh"
            [dataSource]="listaLotes" 
            [showColumnLines]="true" 
            [showRowLines]="true" 
            [showBorders]="true"
            [rowAlternationEnabled]="true" 
            [columnHidingEnabled]="false" 
            [columnAutoWidth]="true"
            (onInitialized)="onInitializedGridLotes(gridLotes)"

            
                                    >
            
            <!-- Enable row selection with checkboxes -->
            <dxo-selection mode="multiple" showCheckBoxesMode="always"></dxo-selection>
            <dxo-column-chooser [enabled]="true" width="35"></dxo-column-chooser>       
            
            <dxi-column dataField="rlo_numero" caption="Lote" width="100"></dxi-column>
            <dxi-column dataField="rlo_fecha" caption="Fecha" dataType="date" format="yyyy/MM/dd" width="150"></dxi-column>
            <dxi-column dataField="clp_nomcom" caption="Proveedor" width="150"></dxi-column>
            <dxi-column dataField="gtr_piscin" caption="Piscina" width="100"></dxi-column>
        </dx-data-grid>
    </div>

</div>
