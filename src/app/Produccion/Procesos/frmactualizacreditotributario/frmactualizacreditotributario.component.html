<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>

<div style="padding: 10px 2%">
    <div class="row justify-content-center">
        <div class="col-lg-2 col-md-4 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Nuevo" icon="file" type="outlined" (onClick)="onClickNuevo()">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-3 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Seleccionar Archivo" icon="upload" type="default" (onClick)="onClickCargarExcel()">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-3 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Guardar" icon="save" type="success" (onClick)="onClickGuardar()">
                <!-- [disabled]="disabledBtnGuardar"> -->
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-3 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Exportar Modelo Excel" icon="xlsxfile" type="outlined" (onClick)="onClickDescargarPlantilla()">
            </dx-button>
        </div>
    </div>

    <div class="row justify-content-center">
       <div class="col-lg-8 col-md-8 col-sm-12 col-12 pb-1 sng-dbtn">
         
         <div class="card"> 
        <!-- <div class="card sng-card mx-auto" style="float:none;"> -->
            <div class="card-header" style="font-weight: bold;border: 2px solid #d9dbdd; border-radius: 4px;color: #0087b9;">
                {{title}}
            </div>
            <div class="card-body" style="border: 2px solid #d9dbdd; border-radius: 4px">
                <div class="form-group" style="padding: 5px; margin-right: 2px">
                    <div class="row margin-container">
                        <!-- <p class="grid-titulo" style="width:100%;font-weight: bold;border: 2px solid #d9dbdd; border-radius: 4px;color: #0087b9;text-align:center;margin-bottom:4px;padding:8px 0 8px 0;font-size:15px;text-transform:uppercase;background:#fff;">Previo antes de actualizar</p> -->
                        <p class="grid-titulo" style="width:100%; margin:auto; font-weight:bold; border-bottom:2px solid #0087b9; color:#222; text-align:center; margin-bottom:8px; padding:8px 32px 8px 32px; font-size:12px; text-transform:uppercase; background:#fff;">Previo antes de actualizar</p>
                         <div class="pb-1 w-100 d-flex justify-content-center" *ngIf="tbDeudas && tbDeudas.length > 0"></div>
                         <!-- <div class="pb-1 d-flex justify-content-center" style="width:100%;"> -->
                            <div style="width:fit-content; max-width: 500px; min-width: 280px; margin:auto;">
                            <!-- <div style="width:fit-content; max-width: 100%; min-width: 0;"> -->
                            <!-- <div style="width:100%; max-width: 100%; min-width: 0;"> 
                            <div style="width:fit-content; margin:auto;"> -->
                            <dx-data-grid #Grid_deudas
                                id="Grid_deudas"
                                style="width:100%; max-width: 100%; min-width: 0; max-height: 75vh"
                                
                                [wordWrapEnabled]="true"
                                [dataSource]="tbDeudas"
                                [showColumnLines]="true"
                                [showRowLines]="true"
                                [showBorders]="true"
                                [rowAlternationEnabled]="true"
                                [columnHidingEnabled]="false"
                                (onInitialized)="onInitializedDeudas(Grid_deudas)"
                            >
                                                                <dxo-filter-row [visible]="true" [applyFilter]="currentFilter" ></dxo-filter-row>
                                                                <ng-container *ngIf="tbDeudas && tbDeudas.length > 0">
                                                                    <ng-container *ngFor="let col of getDynamicColumns(tbDeudas); let i = index">
                                                                        <dxi-column
                                                                            [dataField]="col"
                                                                            [caption]="col"
                                                                            [visible]="true"
                                                                            [allowResizing]="true"
                                                                            [alignment]="'center'"
                                                                        ></dxi-column>
                                                                    </ng-container>
                                                                </ng-container>
                                                                <div *dxTemplate="let cell of 'cellTempValor'">
                                    <div>
                                        <input type="text" class="form-control"
                                            (change)=" onChangeValorCorte($event.target.value, cell) " [(ngModel)]="cell.value"
                                            style=" width: 100%; border: 0px; background-color: transparent; text-align: left; " />
                                    </div>
                                </div>
                                <div *dxTemplate="let cell of 'cellTempValorAut'">
                                    <div>
                                        <input type="text" class="form-control"
                                            (change)=" onChangeValorAutCorte($event.target.value, cell) " [(ngModel)]="cell.value"
                                            style=" width: 100%; border: 0px; background-color: transparent; text-align: left; " />
                                    </div>
                                </div>
                                <dxo-paging [pageSize]="50" [enabled]="false"></dxo-paging>
                            </dx-data-grid>
                            </div>
                        </div>
                    </div>  
                    <div class="row margin-container">
                        <p class="grid-titulo" style="width:100%; margin:auto; font-weight:bold; border-bottom:2px solid #0087b9; color:#222; text-align:center; margin-bottom:8px; padding:8px 32px 8px 32px; font-size:12px; text-transform:uppercase; background:#fff;" *ngIf="tbErrores && tbErrores.length > 0">Errores o Inconsistencias</p>
                        <div class="pb-1 w-100 d-flex justify-content-center" *ngIf="tbErrores && tbErrores.length > 0">
                            <div style="width:fit-content; max-width: 500px; min-width: 280px;">
                            <dx-data-grid #Grid_errores
                                id="Grid_errores"
                                style="width:100%; max-width: 100%; min-width: 0; margin:auto;"
                                [dataSource]="tbErrores"
                                [showColumnLines]="true"
                                [showRowLines]="true"
                                [showBorders]="true"
                                [rowAlternationEnabled]="true"
                                [columnHidingEnabled]="false"
                                [columnAutoWidth]="false"
                                [wordWrapEnabled]="true"
                                [scrolling]="{ mode: 'standard' }"
                                (onInitialized)="onInitializedError(Grid_errores)"
                            >
                                <!-- <dxo-filter-row [visible]="true" [applyFilter]="currentFilter" ></dxo-filter-row> -->
                                                                <dxi-column dataField="id_deuda" caption="Deuda" [visible]="true" [width]="90"></dxi-column>
                                                                <dxi-column dataField="error" caption="Errores" [visible]="true" [width]="350">
                                                                    <div *dxTemplate="let data of 'cell'">
                                                                        <div style="white-space: pre-line; word-break: break-word; min-height: 32px; width: 100%;">
                                                                            {{ data.value }}
                                                                        </div>
                                                                    </div>
                                                                </dxi-column>
                                <div *dxTemplate="let cell of 'cellTempValor'">
                                    <div>
                                        <input type="text" class="form-control"
                                            (change)=" onChangeValorCorte($event.target.value, cell) " [(ngModel)]="cell.value"
                                            style=" width: 100%; border: 0px; background-color: transparent; text-align: left; " />
                                    </div>
                                </div>
                                <div *dxTemplate="let cell of 'cellTempValorAut'">
                                    <div>
                                        <input type="text" class="form-control"
                                            (change)=" onChangeValorAutCorte($event.target.value, cell) " [(ngModel)]="cell.value"
                                            style=" width: 100%; border: 0px; background-color: transparent; text-align: left; " />
                                    </div>
                                </div>
                                <dxo-paging [pageSize]="50" [enabled]="false"></dxo-paging>
                            </dx-data-grid>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
