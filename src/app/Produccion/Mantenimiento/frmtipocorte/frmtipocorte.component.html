<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>


<div style="padding: 10px 5px">
    <div class="row">
        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn">
            <dx-button text="Nuevo" icon="file" type="outlined" (onClick)="onClickNuevo()">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-4 col-sm-6 col-12 pb-1 sng-dbtn">
            <dx-button text="Consultar" icon="find" type="default" (onClick)="onClickConsultar()">
            </dx-button>
        </div>

        <div class="col-lg-2 col-md-3 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Guardar" icon="save" type="success" (onClick)="onClickGuardar()"
                [disabled]="disabledBtnGuardar">
            </dx-button>
        </div>
    </div>

    <div class="row">
        <div class="card sng-card">
            <div class="card-header"> Parametrización Corte </div>
            <div class="card-body">
                <div class="form-group">
                    <div class="row margin-container">
                        <label class="col-12 col-sm-12 col-md-2 col-lg-1 pb-1 control-label">Tipo Corte:</label>
                        <div class="col-12 col-sm-12 col-md-4 col-lg-2 pb-1">
                            <ng-select style="width: 100%" [(ngModel)]="cmbTipoCorte" appendTo="body" [searchable]="true" [clearable]="false"
                                (change)="onTipoCorteChange($event)">
                                <ng-option *ngFor="let data of listaTipoCorte" [value]="data.tcorte_codigo">
                                    <div title="{{ data.tcorte_descri }}" style="font-size: 12px">
                                        {{ data.tcorte_descri }}
                                    </div>
                                </ng-option>
                            </ng-select>
                        </div>
                
                    </div>
                </div>
                <div class="form-group">
                    <div class="row margin-container">
                        <div class="col-sm-12 col-md-12 col-lg-12 pb-1">
                            <!-- <p class="sng-grid-title">TipoFacturas</p> -->
                            <dx-data-grid #GridTipoFacturas 
                                id="GridTipoFacturas" 
                                style="width: 100%; max-height: 35vh"
                                [dataSource]="listaTipoFacturas" 
                                [showColumnLines]="true" 
                                [showRowLines]="true" 
                                [showBorders]="true"
                                [rowAlternationEnabled]="true" 
                                [columnHidingEnabled]="false" 
                                [columnAutoWidth]="true"
                                (onInitialized)="onInitializedTipoFacturas(GridTipoFacturas)"
                            >
                                <!-- Columna para mostrar el texto del combo "tmp_tipo" -->
                                <dxi-column dataField="tc_descripcion" caption="Factura"></dxi-column>
                                <dxi-column dataField="co_valorTipoFacturas" caption="T. Corte" cellTemplate="cellTempValor"> </dxi-column>
                                <div *dxTemplate="let cell of 'cellTempValor'">
                                    <div>
                                        <input type="text" class="form-control"
                                            (change)=" onChangeValorTipoFacturas($event.target.value, cell) " [(ngModel)]="cell.value"
                                            style=" width: 100%; border: 0px; background-color: transparent; text-align: left; " />
                                    </div>
                                </div>
                        
                                <!-- Opciones de paginación -->
                                <dxo-paging [pageSize]="3" [enabled]="false"></dxo-paging>
                            </dx-data-grid>
                        </div>
                    </div>
                </div>
                <div class="form-group mt-4">
                    <div class="row margin-container">
                        <label class="col-12 col-sm-12 col-md-2 col-lg-2 pb-1 control-label">Observación:</label>
                        <div class="col-12 col-sm-12 col-md-10 col-lg-10 pb-1" style="display: flex">
                            <textarea type="text" class="form-control" style="height: 100px" [(ngModel)]="txtObservacion"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
