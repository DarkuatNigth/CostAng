
<dx-load-panel
  #loadPanel
  shadingColor="rgba(0,0,0,0.4)"
  [(visible)]="loadingVisible"
  [showIndicator]="true"
  [showPane]="true"
  [shading]="true"
  [closeOnOutsideClick]="false"
>
</dx-load-panel>

<!-- create a button to save, 2 combos 1 for usuario 1 for transaccion , 1 datagrid wich columns checkbox, usuario, transaccion -->
<div style="padding: 10px 2%">
    <div id="r1" class="row col-sm-12 col-md-10 col-lg-10 col-xl-8 mx-auto" style="padding-left:-1;padding-right:0;">
        <div class="col-lg-2 col-md-3 col-sm-6 col-6 pb-1 sng-dbtn">
            <dx-button text="Guardar" icon="save" type="success" (onClick)="onClickGuardar()">
            </dx-button>
        </div>
    </div>

    <div id="r2" class="row col-sm-12 col-md-10 col-lg-10 col-xl-8 mx-auto d-flex justify-content-center">
        <div class="card sng-card">
            <div class="card-header"> {{title}} </div>
            <div class="card-body">
                
                <div class="form-group">
                    <div class="row margin-container">
                        <div class="col-12 col-sm-12 col-md-8 col-lg-6 pb-1 d-flex align-items-center">
                            <label class="mb-0 mr-2 control-label" style="min-width: 90px;">Usuario:</label>
                            <ng-select style="width: 100%" [(ngModel)]="cmbUsuario" appendTo="body" [searchable]="true" [clearable]="true"
                                (change)="onUsuarioChange($event)">
                                <ng-option *ngFor="let data of Usuarios" [value]="data.identifica">
                                    <div title="{{ data.identificaNom}}" style="font-size: 12px">
                                        {{ data.identificaNom }}
                                    </div>
                                </ng-option>
                            </ng-select>
                        </div>
                    </div>
                    <div class="row margin-container">
                        <div class="col-12 col-sm-12 col-md-8 col-lg-6 pb-1 d-flex align-items-center">
                            <label class="mb-0 mr-2 control-label" style="min-width: 90px;">Transacción:</label>
                            <ng-select style="width: 100%" [(ngModel)]="cmbTransaccion" appendTo="body" [searchable]="true" [clearable]="true">
                                <ng-option *ngFor="let data of Transacciones" [value]="data.trs_codigo">
                                    <div title="{{ data.trs_descri }}" style="font-size: 12px">
                                        {{ data.trs_descri }}
                                    </div>
                                </ng-option>
                            </ng-select>
                            <button type="button" class="btn btn-success btn-sm ml-2" 
                                title="Agregar Transacción" (click)="onAgregarTransaccion()">
                                <i class="fa fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <br>

                <div class="form-group">
                    <div class="row justify-content-center margin-container">
                        <div class="col-12 pb-1" style="margin-left:auto;margin-right:auto;">
                            <dx-data-grid
                                #dataGridTransaccionUsuario
                                key="trs_id"
                                [dataSource]="transaccionUsuario"
                                [showBorders]="true"
                                [allowColumnResizing]="true"
                                [columnAutoWidth]="true"
                                [height]="400"
                                (onRowRemoved)="onRemoveTransaccionUsuario($event)"
                            >
                                
                                <dxo-editing
                                    mode="row"
                                    [allowDeleting]="true"
                                    [useIcons]="true"
                                    [texts]="{
                                    saveRowChanges: 'Aceptar',
                                    cancelRowChanges: 'Cancelar',
                                    }" 
                                >
                                    <dxo-texts
                                        confirmDeleteMessage="¿Está seguro de eliminar el registro?">
                                    </dxo-texts>
                                </dxo-editing>

                                
                                <dxo-paging [pageSize]="10"></dxo-paging>
                                <dxo-pager
                                    [showPageSizeSelector]="true"
                                    [allowedPageSizes]="[5, 10, 20]"
                                    [showInfo]="true"
                                    [infoText]="'Página {0} de {1} ({2} registros)'"
                                >
                                </dxo-pager>

                                <dxi-column [caption]="'Eliminar'" type="buttons" [width]="110">
                                    <dxi-button [cssClass]="'color-danger'" name="delete" ></dxi-button>
                                </dxi-column>

                                <dxi-column dataField="trs_descri" caption="Transacción" dataType="string">
                                </dxi-column>
                                <dxi-column dataField="NOM" caption="Usuario" dataType="string">
                                </dxi-column>
                                
                            </dx-data-grid>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
