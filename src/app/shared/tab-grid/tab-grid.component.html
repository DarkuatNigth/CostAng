<dx-tab-panel [dataSource]="tabsFiltrados" [selectedIndex]="0">

    <div *dxTemplate="let mainTab of 'title'">
        <i class="dx-icon-{{mainTab.icon}}"></i> <span>{{mainTab.title}}</span>
    </div>

    <div *dxTemplate="let mainTab of 'item'">

        <!-- ══════════════════════════════════════════════════════════════════════
         TAB: PROCESOS GENERALES
    ══════════════════════════════════════════════════════════════════════ -->
        <div *ngIf="mainTab.id === 'PG'" class="p-3">
            <dx-tab-panel [dataSource]="subTabsGenerales" [loop]="false" class="subtab-custom" [scrollingEnabled]="true">

                <div *dxTemplate="let subTab of 'title'">
                    <i class="dx-icon-{{subTab.icon}}"></i> <span>{{subTab.titulo}}</span>
                </div>

                <div *dxTemplate="let subTab of 'item'">
                    <div class="p-2">
                        <dx-data-grid
                            [dataSource]="subTab.titulo === 'Totales' ? getTotales('PG') : getParticiones('PG', subTab.titulo)"
                            keyExpr="Codigo" [showBorders]="true"
                            [repaintChangesOnly]="true" (onRowUpdated)="onValueChange($event, 'PG')">

                            <dxo-grouping [autoExpandAll]="subTab.titulo !== 'Totales'"></dxo-grouping>
                            <dxo-editing mode="cell" [allowUpdating]="subTab.titulo !== 'Totales'"></dxo-editing>

                            <!-- Totales → agrupa por Grupo (filas = particiones) -->
                            <dxi-column dataField="grupo" caption="Grupo" [groupIndex]="0"
                                sortOrder="asc" [sortingMethod]="ordenarGrupo"
                                [allowEditing]="false" *ngIf="subTab.titulo === 'Totales'"></dxi-column>

                            <!-- Detalle → agrupa por Partición (filas = procesos) -->
                            <dxi-column dataField="particion" caption="Partición" [groupIndex]="0"
                                sortOrder="asc" [sortingMethod]="ordenarGrupo"
                                [allowEditing]="false" *ngIf="subTab.titulo !== 'Totales'"></dxi-column>

                            <dxi-column dataField="Descripcion" caption="Proceso" [allowEditing]="false"
                                cellTemplate="descripcionCellTemplate">
                            </dxi-column>

                            <div *dxTemplate="let cell of 'descripcionCellTemplate'">
                                <span [title]="getTooltip(cell.data.Descripcion)">
                                    {{ cell.data.Descripcion }}
                                </span>
                            </div>
                            <dxi-column dataField="Valor" caption="Dólares Totales"
                                [format]="{type:'currency', precision: 2}">
                            </dxi-column>
                            <dxi-column dataField="Libras_Proceso" caption="Libras Totales (FRS+RPC)"
                                [allowEditing]="false" format="#,##0.00">
                            </dxi-column>
                            <dxi-column dataField="Costo_Unitario" caption="C. Unitario General" [allowEditing]="false"
                                [format]="{type:'currency', precision: 4}">
                            </dxi-column>

                            <dxo-summary [calculateCustomSummary]="summaryFnPG">
                                <dxi-total-item column="Valor" summaryType="sum"
                                    [valueFormat]="{type:'currency', precision: 2}" displayFormat="Total: {0}">
                                </dxi-total-item>
                                <dxi-total-item name="LibrasTotal" column="Libras_Proceso" summaryType="custom"
                                    valueFormat="#,##0.00" displayFormat="{0}">
                                </dxi-total-item>
                                <dxi-total-item name="CostoUnitarioTotal" summaryType="custom" column="Costo_Unitario"
                                    [valueFormat]="{type:'currency', precision: 4}" displayFormat="C/Lb: {0}">
                                </dxi-total-item>
                                <dxi-group-item column="Valor" summaryType="sum" [alignByColumn]="true"
                                    [valueFormat]="{type:'currency', precision: 2}" displayFormat="{0}">
                                </dxi-group-item>

                                <!-- Libras del grupo: SIN column, con showInColumn -->
                                <dxi-group-item name="LibrasGrupo" summaryType="custom"[alignByColumn]="true" showInColumn="Libras_Proceso"
                                    valueFormat="#,##0.00" displayFormat="{0}">
                                </dxi-group-item>

                                <!-- C.Unitario del grupo = costo grupo / libras grupo: SIN column, con showInColumn -->
                                <dxi-group-item name="CU_Grupo" summaryType="custom" [alignByColumn]="true" showInColumn="Costo_Unitario"
                                    [valueFormat]="{type:'currency', precision: 4}" displayFormat="C/Lb: {0}">
                                </dxi-group-item>
                            </dxo-summary>
                        </dx-data-grid>
                    </div>
                </div>

            </dx-tab-panel>
        </div>

        <!-- ══════════════════════════════════════════════════════════════════════
         TAB: FRS y RPC
    ══════════════════════════════════════════════════════════════════════ -->
        <div *ngIf="mainTab.id === 'FRS' || mainTab.id === 'RPC'" class="p-3">
            <dx-tab-panel [dataSource]="mainTab.id === 'FRS' ? subTabsFresco : subTabsSecundario" [loop]="false" [scrollingEnabled]="true"
                class="subtab-custom">

                <div *dxTemplate="let subTab of 'title'">
                    <i class="dx-icon-{{subTab.icon}}"></i> <span>{{subTab.titulo}}</span>
                </div>

                <div *dxTemplate="let subTab of 'item'">
                    <div class="p-2">
                        <dx-data-grid
                            [dataSource]="subTab.titulo === 'Totales' ? getTotales(mainTab.id) : getParticiones(mainTab.id, subTab.titulo)"
                            keyExpr="Codigo" [showBorders]="true"
                            (onEditorPreparing)="onEditorPreparing($event)" [repaintChangesOnly]="true"
                            (onRowUpdated)="onValueChange($event, mainTab.id)">

                            <dxo-grouping [autoExpandAll]="subTab.titulo !== 'Totales'"></dxo-grouping>
                            <dxo-editing mode="cell" [allowUpdating]="subTab.titulo !== 'Totales'"></dxo-editing>

                            <!-- Totales → agrupa por Grupo (filas = particiones) -->
                            <dxi-column dataField="grupo" caption="Grupo" [groupIndex]="0"
                                sortOrder="asc" [sortingMethod]="ordenarGrupo"
                                [allowEditing]="false" *ngIf="subTab.titulo === 'Totales'"></dxi-column>

                            <!-- Detalle → agrupa por Partición (filas = procesos) -->
                            <dxi-column dataField="particion" caption="Partición" [groupIndex]="0"
                                sortOrder="asc" [sortingMethod]="ordenarGrupo"
                                [allowEditing]="false" *ngIf="subTab.titulo !== 'Totales'"></dxi-column>

                            <dxi-column dataField="Descripcion" caption="Proceso" [allowEditing]="false"
                                cellTemplate="descripcionCellTemplate">
                            </dxi-column>

                            <div *dxTemplate="let cell of 'descripcionCellTemplate'">
                                <span [title]="getTooltip(cell.data.Descripcion)">
                                    {{ cell.data.Descripcion }}
                                </span>
                            </div>
                            <dxi-column dataField="Valor" caption="Costo ($)"
                                [format]="{type:'currency', precision: 2}">
                            </dxi-column>
                            <dxi-column dataField="Libras_Proceso" caption="Libras" [allowEditing]="false"
                                format="#,##0.00">
                            </dxi-column>
                            <dxi-column dataField="Costo_Unitario" caption="C. Unitario" [allowEditing]="false"
                                [format]="{type:'currency', precision: 4}">
                            </dxi-column>

                            <dxo-summary [calculateCustomSummary]="mainTab.id === 'FRS' ? summaryFnFRS : summaryFnRPC">
                                <dxi-total-item column="Valor" summaryType="sum"
                                    [valueFormat]="{type:'currency', precision: 2}" displayFormat="Total: {0}">
                                </dxi-total-item>
                                <dxi-total-item name="LibrasTotal"  column="Libras_Proceso" summaryType="custom" valueFormat="#,##0.00" 
                                displayFormat="{0}">
                                </dxi-total-item>
                                <dxi-total-item name="CostoUnitarioTotal" summaryType="custom" column="Costo_Unitario"
                                    [valueFormat]="{type:'currency', precision: 4}" displayFormat="C/Lb: {0}">
                                </dxi-total-item>
                                <dxi-group-item column="Valor" summaryType="sum" [alignByColumn]="true"
                                    [valueFormat]="{type:'currency', precision: 2}" displayFormat="{0}">
                                </dxi-group-item>

                                <!-- Libras del grupo: SIN column, con showInColumn -->
                                <dxi-group-item name="LibrasGrupo" summaryType="custom" [alignByColumn]="true"
                                    showInColumn="Libras_Proceso" valueFormat="#,##0.00" displayFormat="{0}">
                                </dxi-group-item>

                                <!-- C.Unitario del grupo = costo grupo / libras grupo: SIN column, con showInColumn -->
                                <dxi-group-item name="CU_Grupo" summaryType="custom" [alignByColumn]="true" showInColumn="Costo_Unitario"
                                    [valueFormat]="{type:'currency', precision: 4}" displayFormat="C/Lb: {0}">
                                </dxi-group-item>
                            </dxo-summary>
                        </dx-data-grid>
                    </div>
                </div>
            </dx-tab-panel>
        </div>
        <!-- ══════════════════════════════════════════════════════════════════════
         TAB: TARIFAS / ADICIONALES
    ══════════════════════════════════════════════════════════════════════ -->
        <div *ngIf="mainTab.id === 'TAR'" class="p-3">
            <dx-data-grid [dataSource]="dataTarifas" keyExpr="Codigo" [showBorders]="true" [repaintChangesOnly]="true"
                (onRowUpdated)="onValueChange($event, 'TAR')">

                <dxo-filter-row [visible]="true"></dxo-filter-row>
                <dxo-editing mode="cell" [allowUpdating]="true"></dxo-editing>

                <dxi-column dataField="Descripcion" [allowEditing]="false"></dxi-column>
                <dxi-column dataField="Valor" caption="Tarifa ($)" [format]="{type:'currency', precision: 4}">
                </dxi-column>
                <dxi-column dataField="Libras_Proceso" caption="Libras" [allowEditing]="false" format="#,##0.00">
                </dxi-column>
                <dxi-column dataField="Costo_Unitario" caption="Costo Total" [allowEditing]="false"
                    [format]="{type:'currency', precision: 2}">
                </dxi-column>

                <dxo-summary [calculateCustomSummary]="summaryFnTAR">
                    <dxi-total-item column="Libras_Proceso" summaryType="sum" valueFormat="#,##0.00"
                        displayFormat="{0}">
                    </dxi-total-item>
                    <dxi-total-item column="Costo_Unitario" summaryType="sum"
                        [valueFormat]="{type:'currency', precision: 2}" displayFormat="Total: {0}">
                    </dxi-total-item>
                    <dxi-total-item name="CostoUnitarioTotal" summaryType="custom" column="Valor"
                        [valueFormat]="{type:'currency', precision: 4}" displayFormat="C/Lb: {0}">
                    </dxi-total-item>
                </dxo-summary>
            </dx-data-grid>
        </div>

    </div>
</dx-tab-panel>
